name: Windows build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NameSSH main.py
      - name: Smoke test executable startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path dist/NameSSH.exe) -PassThru
          Start-Sleep -Seconds 15
          $process.Refresh()
          if ($process.HasExited) { throw "NameSSH exited during startup: $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: NameSSH-Windows
          path: dist/NameSSH.exe
          if-no-files-found: error
      - name: Publish requested release
        if: github.ref == 'refs/heads/arena/ed14dbb3-namessh' && github.event_name == 'push' && github.event.head_commit.message == 'Release NameSSH v0.1.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v0.1.0 dist/NameSSH.exe
          --target ${{ github.sha }}
          --title "NameSSH v0.1.0"
          --notes "Первый выпуск для Windows: поиск SSH-серверов, подключение по паролю или ключу и интерактивный терминал. Сверяйте отпечаток сервера. EXE не подписан."
